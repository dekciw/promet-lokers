  <rect x="138" y="63" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="138" y="70" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="138" y="77" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="138" y="56" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="138" y="63" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="138" y="70" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="138" y="77" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
