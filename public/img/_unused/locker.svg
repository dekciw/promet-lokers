  <rect x="61" y="374" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="61" y="381" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="61" y="388" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="61" y="395" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="61" y="374" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="61" y="381" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="61" y="388" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="61" y="395" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>

  <!-- ======== DOOR 2 (middle) x: 124–198 ======== -->
  <rect x="124" y="46" width="74" height="366" rx="1" fill="url(#doorGrad)" stroke="#aebac2" stroke-width="0.75"/>
  <rect x="124" y="46" width="74" height="3" rx="1" fill="rgba(0,0,0,0.06)"/>
