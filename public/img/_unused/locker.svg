  <rect x="201" y="46" width="74" height="366" rx="1" fill="url(#doorGrad)" stroke="#aebac2" stroke-width="0.75"/>
  <rect x="201" y="46" width="74" height="3" rx="1" fill="rgba(0,0,0,0.06)"/>
  <!-- Door 3 top vents -->
  <rect x="215" y="56" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="215" y="63" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="215" y="70" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="215" y="77" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="215" y="56" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="215" y="63" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="215" y="70" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="215" y="77" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <!-- Door 3 lock -->
  <circle cx="238" cy="232" r="9.5" fill="#cdd7de" stroke="#98a4ac" stroke-width="1.5"/>
  <circle cx="238" cy="232" r="9.5" fill="url(#topGrad)" opacity="0.6"/>
  <circle cx="238" cy="232" r="4.5" fill="#a8b4bc"/>
  <rect x="236.3" y="230" width="3.4" height="7.5" rx="1.4" fill="#88949c"/>
  <!-- Door 3 bottom vents -->
  <rect x="215" y="374" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="215" y="381" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="215" y="388" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="215" y="395" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="215" y="374" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="215" y="381" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="215" y="388" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="215" y="395" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>

  <!-- Screw holes on left frame (like ref image) -->
  <circle cx="45" cy="68" r="2.5" fill="#b4bec6" stroke="#9aa4ac" stroke-width="0.75"/>
  <circle cx="45" cy="250" r="2.5" fill="#b4bec6" stroke="#9aa4ac" stroke-width="0.75"/>
</svg>
