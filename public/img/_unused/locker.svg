  <circle cx="161" cy="232" r="9.5" fill="#cdd7de" stroke="#98a4ac" stroke-width="1.5"/>
  <circle cx="161" cy="232" r="9.5" fill="url(#topGrad)" opacity="0.6"/>
  <circle cx="161" cy="232" r="4.5" fill="#a8b4bc"/>
  <rect x="159.3" y="230" width="3.4" height="7.5" rx="1.4" fill="#88949c"/>
  <!-- Door 2 bottom vents -->
  <rect x="138" y="374" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="138" y="381" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="138" y="388" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="138" y="395" width="46" height="4" rx="2" fill="#94a0a8"/>
  <rect x="138" y="374" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="138" y="381" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="138" y="388" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="138" y="395" width="46" height="1" rx="1" fill="rgba(255,255,255,0.2)"/>

